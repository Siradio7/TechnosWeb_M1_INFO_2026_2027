<header>
  <div>
    <b>Guitar Practice Cloud</b>
    <small>Le cloud qui manque à votre ampli</small>
  </div>
  <nav aria-label="Navigation principale">
    @if (auth.isLoggedIn()) {
      <a routerLink="/tracks">Backing tracks</a>
      <a routerLink="/profile">Profil @if (auth.currentUser(); as user) { ({{ user.name }}) }</a>
      <button type="button" class="btn-logout" (click)="logout()">Déconnexion</button>
    } @else {
      <a routerLink="/login">Connexion</a>
      <a routerLink="/register">Créer un compte</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>
